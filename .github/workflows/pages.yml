name: Pages

# Publica el dashboard (DuckDB-WASM sobre Gold) y la documentación de dbt.
# Requiere Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Rango fijo: el generador es determinista, así que el sitio solo cambia con el código.
  START: "2026-09-01"
  END: "2026-10-23"
  # Precio de lista de una Lambda arm64 de 3008 MB (mismo cálculo que infra/aws/main.tf),
  # para que ops/pipeline_runs tenga un costo estimado.
  LAKEHOUSE_COST_PER_SECOND: "0.0000391670"
  LAKEHOUSE_COST_PER_RUN: "0.0000002"

jobs:
  build:
    name: Construir sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install PYTHON=python
      - run: make generate
      - run: make run
      - run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
