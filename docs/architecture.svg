<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Arquitectura: el productor escribe raw y un marcador _SUCCESS; el evento dispara Lambda o Cloud Run, que corre dbt con DuckDB en memoria y escribe bronze, silver, gold y métricas en el bucket">
  <style>
    .bg { fill: #fcfcfb; }
    .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1; }
    .accent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
    .bucket { fill: #f4f3ef; stroke: #c3c2b7; stroke-width: 1; stroke-dasharray: 4 3; }
    .t { fill: #0b0b0b; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .m { fill: #898781; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; }
    .arrow { stroke: #52514e; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .head { fill: #52514e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .box { fill: #262624; stroke: #4a4a46; }
      .accent { fill: #1d2a3a; stroke: #3987e5; }
      .bucket { fill: #20201e; stroke: #4a4a46; }
      .t { fill: #f0efec; }
      .s { fill: #c3c2b7; }
      .arrow { stroke: #c3c2b7; }
      .head { fill: #c3c2b7; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="460" rx="12"/>

  <!-- Productor -->
  <rect class="box" x="20" y="30" width="150" height="126" rx="8"/>
  <text class="t" x="95" y="86" text-anchor="middle">Productor</text>
  <text class="s" x="95" y="104" text-anchor="middle">feeds diarios</text>

  <!-- Raw + marcador -->
  <rect class="box" x="210" y="30" width="190" height="56" rx="8"/>
  <text class="t" x="305" y="53" text-anchor="middle">raw/ecommerce/&lt;entidad&gt;</text>
  <text class="s" x="305" y="71" text-anchor="middle">NDJSON · year=/month=/day=</text>
  <rect class="accent" x="210" y="100" width="190" height="56" rx="8"/>
  <text class="t" x="305" y="123" text-anchor="middle">_markers/…/_SUCCESS</text>
  <text class="s" x="305" y="141" text-anchor="middle">se escribe al final del día</text>
  <path class="arrow" d="M170,58 H208"/>
  <path class="arrow" d="M170,128 H208"/>

  <!-- Disparo por nube -->
  <rect class="box" x="450" y="20" width="210" height="64" rx="8"/>
  <text class="t" x="555" y="46" text-anchor="middle">AWS</text>
  <text class="s" x="555" y="65" text-anchor="middle">notificación S3 → Lambda arm64</text>
  <rect class="box" x="450" y="100" width="210" height="64" rx="8"/>
  <text class="t" x="555" y="126" text-anchor="middle">GCP</text>
  <text class="s" x="555" y="145" text-anchor="middle">GCS → Pub/Sub → Cloud Run</text>
  <path class="arrow" d="M400,128 H425 V52 H448"/>
  <path class="arrow" d="M425,132 H448"/>
  <text class="m" x="425" y="186" text-anchor="middle">solo el marcador dispara</text>

  <!-- dbt -->
  <rect class="accent" x="700" y="20" width="240" height="144" rx="8"/>
  <text class="t" x="820" y="50" text-anchor="middle">dbt build</text>
  <text class="s code" x="820" y="68" text-anchor="middle">--vars run_date=AAAA-MM-DD</text>
  <text class="s" x="820" y="98" text-anchor="middle">dbt-core + dbt-duckdb</text>
  <text class="s" x="820" y="116" text-anchor="middle">DuckDB :memory: (sin estado)</text>
  <text class="s" x="820" y="134" text-anchor="middle">concurrencia 1 · escala a cero</text>
  <path class="arrow" d="M660,52 H698"/>
  <path class="arrow" d="M660,132 H698"/>

  <!-- dbt <-> bucket -->
  <path class="arrow" d="M820,166 V218" marker-start="url(#head)"/>
  <text class="m" x="810" y="196" text-anchor="end">lee el día · escribe Parquet</text>

  <!-- Bucket -->
  <rect class="bucket" x="20" y="220" width="920" height="130" rx="10"/>
  <text class="t" x="36" y="244">Bucket S3 / GCS</text>
  <text class="s" x="152" y="244">todo el estado vive aquí, en Parquet</text>

  <rect class="box" x="36" y="258" width="168" height="76" rx="8"/>
  <text class="t" x="120" y="290" text-anchor="middle">raw</text>
  <text class="s" x="120" y="309" text-anchor="middle">inmutable</text>
  <rect class="box" x="216" y="258" width="168" height="76" rx="8"/>
  <text class="t" x="300" y="290" text-anchor="middle">bronze</text>
  <text class="s" x="300" y="309" text-anchor="middle">partición del día</text>
  <rect class="box" x="396" y="258" width="168" height="76" rx="8"/>
  <text class="t" x="480" y="290" text-anchor="middle">silver</text>
  <text class="s" x="480" y="309" text-anchor="middle">partición del día</text>
  <rect class="box" x="576" y="258" width="168" height="76" rx="8"/>
  <text class="t" x="660" y="290" text-anchor="middle">gold</text>
  <text class="s" x="660" y="309" text-anchor="middle">solo meses afectados</text>
  <rect class="box" x="756" y="258" width="168" height="76" rx="8"/>
  <text class="t" x="840" y="290" text-anchor="middle">ops/pipeline_runs</text>
  <text class="s" x="840" y="309" text-anchor="middle">duración y costo</text>
  <path class="arrow" d="M204,296 H214"/>
  <path class="arrow" d="M384,296 H394"/>
  <path class="arrow" d="M564,296 H574"/>

  <!-- Frescura y alertas -->
  <rect class="box" x="20" y="384" width="190" height="56" rx="8"/>
  <text class="t" x="115" y="407" text-anchor="middle">Scheduler diario</text>
  <text class="s" x="115" y="425" text-anchor="middle">07:00 UTC</text>
  <rect class="box" x="250" y="384" width="190" height="56" rx="8"/>
  <text class="t" x="345" y="407" text-anchor="middle">check freshness</text>
  <text class="s" x="345" y="425" text-anchor="middle">¿llegó y se procesó ayer?</text>
  <rect class="box" x="480" y="384" width="180" height="56" rx="8"/>
  <text class="t" x="570" y="407" text-anchor="middle">Alertas</text>
  <text class="s" x="570" y="425" text-anchor="middle">SNS · Cloud Monitoring</text>
  <path class="arrow" d="M210,412 H248"/>
  <path class="arrow" d="M440,412 H478"/>

  <!-- Consumo -->
  <rect class="accent" x="700" y="384" width="240" height="56" rx="8"/>
  <text class="t" x="820" y="407" text-anchor="middle">Dashboard y BI</text>
  <text class="s" x="820" y="425" text-anchor="middle">DuckDB-WASM · lectores Parquet</text>
  <path class="arrow" d="M720,336 V382"/>
</svg>
